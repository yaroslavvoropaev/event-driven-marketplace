# Тестовая пара RSA-ключей лежит в src/test/resources/certs и коммитится открыто:
# ею подписываются только токены в тестах, защищать ею нечего. Боевой ключ живёт
# в secrets/ вне репозитория и в артефакт не попадает.
#
# Профиль подключается через @ActiveProfiles("test") в классах, поднимающих контекст.
# Файл именно профильный, а не src/test/resources/application.properties: одноимённый
# файл в тестовых ресурсах не дополнил бы основной, а полностью заслонил бы его —
# вместе с flyway.locations и всем остальным.
app.security.jwt.public-key=classpath:certs/app.pub
app.security.jwt.private-key=classpath:certs/app-pkcs8.key
