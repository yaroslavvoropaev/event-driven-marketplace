name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Inspect runner
        run: |
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          nproc && free -h
          java -version
          docker version
          ls -la