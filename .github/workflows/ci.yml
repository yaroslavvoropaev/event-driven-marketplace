name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Inspect runner
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
      - run: ./gradlew testClasses